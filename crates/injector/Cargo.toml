[package]
name = "tronhawk-injector"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "tronhawk-injector-launcher"
path = "src/bin/launcher.rs"

[dependencies]
# Vendored electron-hook (see vendor/electron-hook/VENDOR.md). Vendoring is required because
# upstream ships a submodule + its own [workspace] + under-declares winapi features, which
# cannot be consumed as a plain crates.io/git dependency.
electron-hook = { path = "../../vendor/electron-hook" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tronhawk-ipc = { path = "../ipc" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
