[package]
name = "tronhawk-core"
version.workspace = true
edition.workspace = true

[dependencies]
tronhawk-ipc = { path = "../ipc" }
tronhawk-package = { path = "../package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
# Tier-2 `networkRequest` capability: a small blocking HTTP(S) client. `ureq` 2.x is
# dependency-light (rustls with the `ring` provider; no async runtime, no cookie jar when the
# `cookies` feature is off). gzip is disabled so response bodies stay verbatim and bounded.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only surfaces for the IFEO controls: winreg for the direct (non-elevated) HKLM read
# of `getIefoRegistration`, and raw winapi for the elevated `ShellExecuteExW("runas")` write of
# `setIefoRegistration`. Core must NOT link the injector crate (layering); it only shells out to
# the injector's launcher binary.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3.9", features = [
    "errhandlingapi",
    "handleapi",
    "minwindef",
    "processthreadsapi",
    "shellapi",
    "synchapi",
    "winbase",
    "winerror",
    "winnt",
] }
