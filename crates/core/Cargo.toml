[package]
name = "tronhawk-core"
version.workspace = true
edition.workspace = true

[dependencies]
tronhawk-ipc = { path = "../ipc" }
tronhawk-package = { path = "../package" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
