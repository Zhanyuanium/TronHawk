name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --workspace
      - name: Build workspace
        run: cargo build --workspace

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install workspace
        run: bun install
      - name: Typecheck SDK
        working-directory: sdk
        run: bun run typecheck
      - name: Test SDK
        working-directory: sdk
        run: bun test
      - name: Typecheck hello-world plugin
        working-directory: plugins/hello-world
        run: bun run typecheck

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Build injector + core
        run: cargo build -p tronhawk-injector -p tronhawk-core
      - name: Run injection integration test
        shell: pwsh
        run: pwsh tests/integration.ps1
