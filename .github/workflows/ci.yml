name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Build runtime.js bundle
        working-directory: crates/runtime/js
        run: |
          bun install
          bun run build
      - name: Build core + injector
        run: cargo build -p tronhawk-core -p tronhawk-injector
      - name: Stage manager sidecar binaries
        shell: pwsh
        run: |
          $dest = "apps/manager/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force "target/debug/tronhawk-core.exe" "$dest/tronhawk-core-x86_64-pc-windows-msvc.exe"
          Copy-Item -Force "target/debug/tronhawk-injector-launcher.exe" "$dest/tronhawk-injector-launcher-x86_64-pc-windows-msvc.exe"
          Copy-Item -Force "target/debug/tronhawk_injector.dll" "$dest/tronhawk_injector.dll"
          Copy-Item -Force "crates/injector/assets/bootstrap.js" "$dest/bootstrap.js"
          Copy-Item -Force "crates/runtime/assets/runtime.js" "$dest/runtime.js"
      - name: Test workspace
        run: cargo test --workspace
      - name: Build workspace
        run: cargo build --workspace

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install workspace
        run: bun install
      - name: Typecheck SDK
        working-directory: sdk
        run: bun run typecheck
      - name: Test SDK
        working-directory: sdk
        run: bun test
      - name: Typecheck hello-world plugin
        working-directory: plugins/hello-world
        run: bun run typecheck

  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install workspace deps
        run: bun install
      - name: Install test-app deps
        working-directory: apps/test-app
        run: bun install
      - name: Build injector + core
        run: cargo build -p tronhawk-injector -p tronhawk-core
      - name: Run injection integration test
        shell: pwsh
        run: pwsh tests/integration.ps1

  package:
    runs-on: windows-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Stage plugin without node_modules
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "_pkg_stage"
          New-Item -ItemType Directory -Force -Path "_pkg_stage" | Out-Null
          Copy-Item -Recurse -Force -LiteralPath "plugins/hello-world" -Destination "_pkg_stage/hello-world"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "_pkg_stage/hello-world/node_modules"
      - name: Pack hello-world plugin
        run: cargo run -p tronhawk-package --bin pack -- _pkg_stage/hello-world hello-world.thx
      - name: Validate .thx artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "hello-world.thx" -PathType Leaf)) { throw "hello-world.thx not found" }
          if ((Get-Item -LiteralPath "hello-world.thx").Length -eq 0) { throw "hello-world.thx is empty" }
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "_thx_check"
          Expand-Archive -LiteralPath "hello-world.thx" -DestinationPath "_thx_check"
          if (-not (Test-Path -LiteralPath "_thx_check/manifest.json" -PathType Leaf)) { throw "manifest.json missing in hello-world.thx" }
          Get-Content -LiteralPath "_thx_check/manifest.json" -Raw | ConvertFrom-Json | Out-Null
