[package]
name = "manager"
version = "0.1.0"
description = "TronHawk manager (Tauri GUI)"
authors = ["TronHawk contributors"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
name = "manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tronhawk-ipc = { path = "../../../crates/ipc" }
